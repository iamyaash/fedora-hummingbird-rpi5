name: Build Hummingbird Pi 5 image

# Builds the bootc container natively on an arm64 runner (no qemu) and assembles a
# flashable SD card image, uploaded as a workflow artifact.

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Release channel. The project is experimental, so everything is "unstable":
  # image tags, the tag cards track, labels and the SD image name. Change this one
  # value when moving to a stable channel.
  CHANNEL: unstable
  IMAGE: localhost/hummingbird-rpi5:unstable
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/hummingbird-rpi5
  DISK_SIZE: 8G

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set tags
        run: |
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "REGISTRY_IMAGE=${REGISTRY_IMAGE,,}" >> "$GITHUB_ENV"
          # What `bootc upgrade` on the Pi pulls: the moving channel tag, pushed from main only
          echo "TARGET_IMGREF=${REGISTRY_IMAGE,,}:$CHANNEL" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af || true
          df -h /

      - name: Install disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfsprogs dosfstools parted
          sudo podman version

      - name: Build bootc image
        run: |
          sudo podman build \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --label "org.opencontainers.image.version=$CHANNEL-$DATE-$SHA" \
            --label "org.opencontainers.image.description=UNSTABLE, experimental Hummingbird image for the Raspberry Pi 5. Not for production use." \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "$IMAGE" \
            -f Containerfile .

      - name: Show image contents
        run: |
          sudo podman run --rm "$IMAGE" bash -c '
            cat /usr/lib/os-release
            ls /usr/lib/modules
            rpm -q kernel-core raspberrypi2-firmware linux-firmware-raspberrypi raspberrypi-userland bootc
            KVER=$(ls /usr/lib/modules)
            modinfo -k "$KVER" -F vermagic vcio
            ls /usr/share/raspberrypi2-kernel-fedora/*/boot
            ls /usr/lib/ostree-boot' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble SD card image
        run: |
          NAME="hummingbird-rpi5-$CHANNEL-$DATE-$SHA.raw"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          sudo scripts/build-sd-image.sh "$IMAGE" "$TARGET_IMGREF" "$RUNNER_TEMP/$NAME" "$DISK_SIZE"

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Every run: unstable-<date>-<sha> and unstable-<sha>. Only main moves `unstable`.
          # No `latest`: that's reserved for a future stable channel.
          TAGS="$CHANNEL-$DATE-$SHA $CHANNEL-$SHA"
          [ "$GITHUB_REF" = refs/heads/main ] && TAGS="$TAGS $CHANNEL"
          for t in $TAGS; do
            sudo podman tag "$IMAGE" "$REGISTRY_IMAGE:$t"
            sudo podman push "$REGISTRY_IMAGE:$t"
            echo "Pushed \`$REGISTRY_IMAGE:$t\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Compress
        run: |
          sudo xz -T0 -3 "$RUNNER_TEMP/$NAME"
          sudo chown "$(id -u)" "$RUNNER_TEMP/$NAME.xz"
          ls -lh "$RUNNER_TEMP/$NAME.xz"

      - name: Upload SD card image
        uses: actions/upload-artifact@v5
        with:
          name: hummingbird-rpi5-${{ env.CHANNEL }}-sdcard-image
          path: ${{ runner.temp }}/${{ env.NAME }}.xz
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
