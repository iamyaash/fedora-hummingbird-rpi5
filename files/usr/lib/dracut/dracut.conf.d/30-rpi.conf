# The Fedora kernel builds these as modules (=m), and the initramfs needs them:
# xfs, erofs and overlay for the root, /boot and composefs mounts, and the SD card
# stack (mmc_block, sdhci, sdhci-pltfm, sdhci-brcmstb) to find the root device.
add_drivers+=" xfs erofs overlay mmc_block sdhci sdhci-pltfm sdhci-brcmstb "
